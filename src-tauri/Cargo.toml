[package]
name = "tracelyn"
version = "0.1.0"
description = "Tracelyn — SSH server monitoring for Windows"
authors = ["Tracelyn"]
edition = "2021"

[lib]
name = "tracelyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
async-trait = "0.1"
russh = "0.46"
russh-keys = "0.46"
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
thiserror = "2"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
native-tls = "0.2"
x509-parser = "0.18"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
