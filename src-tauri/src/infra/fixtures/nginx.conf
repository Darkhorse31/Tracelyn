upstream orders {
 server 127.0.0.1:3000 weight=3;
 server 127.0.0.1:3001 down;
}
server {
 server_name orders.example.com;
 access_log /var/log/nginx/orders.log;
 error_log /var/log/nginx/orders.error;
 location / { proxy_pass http://orders; }
 location /other { proxy_pass http://127.0.0.1:4000; }
}
